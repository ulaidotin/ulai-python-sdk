[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulai-api"
version = "0.1.0"
description = "Python Server SDK for Ulai Cloud"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ulai_api*"]

[tool.setuptools.package-data]
ulai_api = ["py.typed", "*.pyi", "**/*.pyi"]